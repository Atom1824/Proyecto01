<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>MovieFinder</title>
</head>

<body>

    <nav>
        <div class="nav-container">
            <div class="logo-container">
                <a href="index.html"><img src="./assets/logo/logoMovieFinder.png" alt="logoMovieFinder"
                        class="logo"></a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#">Favoritos</a></li>
                <li><a href="#">Categorias</a></li>
            </ul>

            <div class="nav-actions">
                <form><input type="search" name="" id="" placeholder="Buscar"> <button type="submit">Buscar</button>
                </form>
                <button>Dark/Light mode</button>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-overlay">
            <div class="hero-content">
                <h1>Descubre tu próxima película favorita</h1>
                <p>Explora miles de títulos y guarda tus favoritas.</p>
                <button class="hero-btn">Explorar ahora</button>
            </div>
        </div>

    </section>

    <section>
        <div class="Front-page-title">
            <h2>Peliculas populares</h2>
        </div>
        <div class="movie-grid">
            <div class="movie-card">
                <img src="./assets/posters/Fallout-poster.webp" alt="fallout">
            </div>
            <div class="movie-card"><img src="./assets/posters/shposter.jpeg" alt="return to silent hill"></div>
            <div class="movie-card"><img src="./assets/posters/spidermanmovie.jpg" alt="Spiderman No Way Home"></div>
            <div class="movie-card"><img src="./assets/posters/poster hdm" alt="His Dark Material"></div>
            <div class="movie-card"><img src="./assets/posters/hp2.webp" alt="His Dark Material"></div>
            <div class="movie-card"><img src="./assets/posters/hp3.jpg" alt="His Dark Material"></div>
            <div class="movie-card"><img src="./assets/posters/hp4.jpg" alt="His Dark Material"></div>

        </div>
    </section>


</body>

</html>
