<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>MovieFinder</title>
</head>

<body>

    <nav>
        <div class="nav-container">
            <div class="logo-container">
                <a href="index.html">
                    <img src="./assets/logo/logoMovieFinder.png" alt="MovieFinder logo" class="logo">
                </a>
            </div>

            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-links" id="primary-navigation">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="top-rated.html">Mejor Evaluados</a></li>
                <li><a href="categories.html">Categorias</a></li>
            </ul>

            <div class="nav-actions">
                <form id="search-form">
                    <input type="search" id="search-input" placeholder="Buscar pelicula..." aria-label="Buscar pelicula">
                    <button type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

    <section class="hero" id="hero">
        <div class="hero-overlay">
            <div class="hero-content">
                <h1 id="hero-title">Descubre tu proxima pelicula favorita</h1>
                <p id="hero-desc">Explora miles de titulos y guarda tus favoritas.</p>
                <button class="hero-btn">Explorar ahora</button>
            </div>
        </div>
    </section>

    <section>
        <div class="Front-page-title">
            <h2>Novedades</h2>
        </div>
        <div class="movie-grid" id="movie-grid"></div>
        <div class="pagination">
            <button id="prev">Prev</button>
            <span id="page"></span>
            <button id="next">Next</button>
        </div>
    </section>

    <footer>
        <div class="footer-container">
            <div class="footer-left">
                <img src="./assets/logo/logoMovieFinder.png" alt="logo" class="footer-logo">
            </div>

            <div class="footer-links">
                <a href="#">Inicio</a>
                <a href="./top-rated.html">Mejor Evaluados</a>
                <a href="./categories.html">Categorias</a>
            </div>

            <div class="footer-right">
                <p>&copy; 2024 MovieFinder</p>
            </div>
        </div>
    </footer>

    <script src="./js/nav-menu.js"></script>
    <script src="./js/app.js"></script>
    <script src="api.js"></script>
    <script src="index.js"></script>
</body>

</html>
