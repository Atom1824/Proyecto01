<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>MovieFinder</title>
</head>

<body>

    <nav>
        <div class="nav-container">
            <div class="logo-container">
                <a href="index.html"><img src="./assets/logo/logoMovieFinder.png" alt="logoMovieFinder"
                        class="logo"></a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#">Favoritos</a></li>
                <li><a href="#">Categorias</a></li>
            </ul>

            <div class="nav-actions">
                <form id="search-form">
                    <input type="search" id="search-input" pleaceholder="Buscar película..." aria-label="Buscar película">
                    <button type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

   <section class="hero" id="hero">
    <div class="hero-overlay">
        <div class="hero-content">
            <h1 id="hero-title">Descubre tu próxima película favorita</h1>
            <p id="hero-desc">Explora miles de títulos y guarda tus favoritas.</p>
            <button class="hero-btn">Explorar ahora</button>
        </div>
    </div>
</section>

    <section>
        <div class="Front-page-title">
            <h2>Peliculas populares</h2>
        </div>
        <div class="movie-grid" id="movie-grid"></div>
        <div class="pagination">
  <button id="prev">Prev</button>
  <span id="page"></span>
  <button id="next">Next</button>
</div>
    </section>


   <footer>
  <div class="footer-container">

    <div class="footer-left">
      <img src="./assets/logo/logoMovieFinder.png" alt="logo" class="footer-logo">
   
    </div>

    <div class="footer-links">
      <a href="#">Inicio</a>
      <a href="#">Favoritos</a>
      <a href="#">Categorías</a>
    </div>

    <div class="footer-right">
      <p>&copy; 2024 MovieFinder</p>
    </div>

  </div>
</footer>

<script src="./js/app.js"></script>

</body>

</html>
